    function initAudio() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioDest = audioContext.createMediaStreamDestination();
      } catch(e) {
        console.warn("AudioContext skipped:", e);
      }
    }

    function playTone(freq = 432, duration = 0.4) {
      if (!audioContext || !audioDest) return;
      try {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);
        gain.gain.setValueAtTime(0.08, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioDest);
        osc.start();
        osc.stop(audioContext.currentTime + duration);
      } catch(e) {}
    }

    // Bottom Master Timeline Scrubber
    function drawScrubber(t) {
      const w = canvas.width;
      const h = canvas.height;

      // Track
      const trackX = 40;
      const trackY = 680;
      const trackW = w - 80;
      const trackH = 8;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      roundRect(ctx, trackX, trackY, trackW, trackH, 4, true, false);

      // Progress Fill
      const pct = t / TOTAL_DURATION;
      const fillW = Math.max(8, trackW * pct);
      const scrubGrad = ctx.createLinearGradient(trackX, 0, trackX + fillW, 0);
      scrubGrad.addColorStop(0, '#1A6B5F');
      scrubGrad.addColorStop(1, '#4DC1B0');
      ctx.fillStyle = scrubGrad;
      roundRect(ctx, trackX, trackY, fillW, trackH, 4, true, false);

      // Chapter dots
      SCENES.forEach(s => {
        const dotX = trackX + (s.start / TOTAL_DURATION) * trackW;
        ctx.fillStyle = t >= s.start ? '#4DC1B0' : 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(dotX, trackY + 4, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Handle
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(trackX + fillW, trackY + 4, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    // Helper: Round Rectangle
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Start Recording & Rendering
    async function startVideoGeneration() {
      recordedChunks = [];
      console.log("[VIDEO ENGINE] startVideoGeneration invoked.");

      statusTitle.textContent = "🎥 Recording Video Stream...";
      statusDesc.textContent = "Rendering all 180 seconds into high-definition WebM video file...";

      // Setup MediaStream from canvas
      const canvasStream = canvas.captureStream(30);

      let options = {};
      if (typeof MediaRecorder.isTypeSupported === 'function') {
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
          options = { mimeType: 'video/webm;codecs=vp9' };
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
          options = { mimeType: 'video/webm;codecs=vp8' };
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
          options = { mimeType: 'video/webm' };
        }
      }

      mediaRecorder = new MediaRecorder(canvasStream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
          console.log(`[VIDEO ENGINE] Chunk captured: ${e.data.size} bytes`);
        }
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        console.log(`[VIDEO ENGINE] Recording finished. Total blob size: ${blob.size} bytes`);
        statusTitle.textContent = "💾 Saving Demo Video to PC...";
        statusDesc.textContent = `Uploading ${(blob.size / (1024*1024)).toFixed(2)} MB video stream to server to write to hard drive...`;

        try {
          const res = await fetch('/api/v1/save-demo-video', {
            method: 'POST',
            body: blob
          });
          const result = await res.json();
          if (result.success) {
            console.log(`[VIDEO ENGINE] Saved to PC successfully: ${result.filePath} (${result.sizeMB} MB)`);
            statusTitle.textContent = "✅ DEMO VIDEO SUCCESSFULLY SAVED TO PC!";
            statusDesc.innerHTML = `File written to: <code>${result.filePath}</code> (${result.sizeMB} MB).<br>You can play this video anytime or share with judges/investors!`;
            downloadLink.style.display = 'inline-block';
            downloadLink.href = URL.createObjectURL(blob);
          } else {
            console.error('[VIDEO ENGINE] Server upload response error:', result);
            statusTitle.textContent = "⚠️ Upload complete, check server log.";
          }
        } catch(err) {
          console.error('[VIDEO ENGINE] Fetch error:', err);
          statusTitle.textContent = "✅ Video rendered!";
          statusDesc.textContent = `Video recorded (${(blob.size / (1024*1024)).toFixed(2)} MB). Click download below.`;
          downloadLink.style.display = 'inline-block';
          downloadLink.href = URL.createObjectURL(blob);
        }
      };

      mediaRecorder.start(250); // chunk every 250ms

      let t = 0;
      const step = 0.5; // advance 0.5 simulation seconds per tick
      const tickMs = 50; // runs every 50ms -> 180s renders in ~18 seconds
      let lastLogged = -1;

      const recordTimer = setInterval(() => {
        t += step;
        renderFrame(t);

        const curScene = Math.floor(t / 25);
        if (curScene !== lastLogged) {
          lastLogged = curScene;
          console.log(`[VIDEO ENGINE] Rendered ${t.toFixed(0)}s / ${TOTAL_DURATION}s (${SCENES[curScene] ? SCENES[curScene].title : 'Complete'})`);
        }

        if (t >= TOTAL_DURATION) {
          clearInterval(recordTimer);
          console.log("[VIDEO ENGINE] Reached 180 seconds. Stopping recorder...");
          mediaRecorder.stop();
        }
      }, tickMs);
    }

    // Auto-start rendering when loaded in headless mode or regular browser
    window.addEventListener('DOMContentLoaded', () => {
      renderFrame(0);
      const params = new URLSearchParams(window.location.search);
      if (params.get('auto') === 'true') {
        console.log("[VIDEO ENGINE] Auto-rendering triggered.");
        startVideoGeneration();
      }
    });
